name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A PR that supersedes an earlier one cancels its in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, tests, notebook sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Deliberately light: torch / torch-geometric are NOT installed in CI.
      # The heavy modelling code runs on Colab; CI guards the shared library,
      # the metrics that every reported number depends on, and notebook validity.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest ruff

      - name: Lint
        run: ruff check src tests tools

      - name: Format check
        run: ruff format --check src tests tools

      - name: Tests
        run: pytest

      - name: Notebook sanity check
        run: python tools/check_notebooks.py
