[project]
name = "dengue-gnn"
version = "0.1.0"
description = "Physics-informed, GAN-augmented graph neural networks for multi-horizon dengue forecasting (Sri Lanka, 25 districts)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Tharusha Perera" },
    { name = "Praveen De Silva" },
    { name = "Janith Mahanama" },
    { name = "Bimsara Udurawana" },
    { name = "Maleesha Kumarasinghe" },
    { name = "Praveen Nawarathna" },
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/tharushaperera/dengue-forecasting-gnn"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src layout: tests import `dengue_gnn` without needing an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated notebook sources are big string literals, not code we lint.
extend-exclude = ["notebooks/_build", "reference_repo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B905",   # zip(strict=) not available on the Colab Python we target
    "RUF001", # table/report strings carry real maths: sigma, times are intended
    "RUF002", # docstrings carry real maths: sigma, minus, times are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
